<!--
	金苹果 → 「minecraft！」。

	⚠ 画的不是苹果而是**金锭** —— 用户给的那张参考图就是一堆金条，
	   「minecraft！」这个梗也对着它。金苹果本身在游戏里是画得出来的
	   （见 render.js），做成图标反而和别的图标重了。

	⚠ 全是**平涂 + 一圈深色描边**，没有渐变、没有阴影：
	   横幅上只有 26px，带渐变的东西缩到那个尺寸会糊成一团脏色。
	   描边也不是装饰 —— 深棕色的横幅上，纯金色的边缘会化进背景里。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 锭身：上窄下宽的梯形 -->
	<path d="M6.4 9.6h11.2l2.6 7.8H3.8z"
		fill="#e8b23c" stroke="#7d5410" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 顶面：亮一档，读作「这是一个有厚度的块」 -->
	<path d="M6.4 9.6h11.2l1.1 3.2H5.3z" fill="#fbdc86" />
	<!-- 左下角一点反光 -->
	<path d="M7.6 14.2h3.4l-.9 2.6H6.7z" fill="#fff2c8" opacity=".8" />
</svg>
