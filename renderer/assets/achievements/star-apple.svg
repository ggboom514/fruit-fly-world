<!--
	星云苹果 → 「小时的梦想」。

	⚠ 果身用 config 里 visual.food.star 的那一对紫（#5b4bb8 / 果肉浅紫），
	   和游戏里那颗果子是同一套色 —— 图标和实物对不上的话，
	   玩家不会把「刚弹的这个」和「地上那个」联系起来。

	⚠ 里面的星星**故意不画对称**：这是「星空」，不是「一颗星」。
	   留一颗四角星当主角，另外几个小圆点散着，才有星云的意思。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 梗 -->
	<path d="M12 7V4.4" stroke="#7a5a2a" stroke-width="1.5" stroke-linecap="round" />
	<!-- 叶 -->
	<path d="M12.3 4.8c1.7-1.9 4.1-1.8 4.8-1.1.5 1.7-.8 3.5-2.8 3.8-.8.1-1.6-.3-2.1-1.1z"
		fill="#5aa84c" stroke="#2c5a24" stroke-width="1" stroke-linejoin="round" />
	<!-- 果身 -->
	<path d="M12 7.2C11 5.9 9.2 5.2 7.6 5.6 5.4 6.2 4 8.4 4 11.2c0 4 3.3 8.9 8 8.9s8-4.9 8-8.9c0-2.8-1.4-5-3.6-5.6-1.6-.4-3.4.3-4.4 1.6z"
		fill="#5b4bb8" stroke="#2a2360" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 星尘 -->
	<circle cx="8.6" cy="9.8" r=".75" fill="#ded2ff" opacity=".9" />
	<circle cx="15" cy="10.6" r=".6" fill="#c3b4ff" opacity=".85" />
	<circle cx="13.6" cy="15" r=".7" fill="#ded2ff" opacity=".8" />
	<!-- 主角：一颗四角星 -->
	<path d="M10.4 11.4l.75 2.05 2.05.75-2.05.75-.75 2.05-.75-2.05L7.6 14.2l2.05-.75z"
		fill="#fff4c9" />
</svg>
