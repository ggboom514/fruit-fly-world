<!--
	「结晶」→ 蓝水晶。

	⚠ 配色跟着突变的晶体走（石青 → 天蓝 → 近白的高光），不是随便挑的蓝：
	   结晶蝇身上那圈炫彩描边用的就是这一族色，玩家一眼能对上。

	⚠ 切面线是**必须的**。不画那几条棱，整块就是一个蓝色的六边形，
	   读起来像色块不像宝石 —— 宝石感全靠「同一个面上一亮一暗」。
	⚠ 但棱线用的是很淡的深蓝 + 0.7 透明度：画成实黑线的话，
	   26px 下整块会被切成三四片碎色。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 整块：上面一个尖、底下收窄，六边形轮廓 -->
	<path d="M12 2.2l6 5.2-2.1 12.4H8.1L6 7.4z"
		fill="#3fa9dd" stroke="#123f5c" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 右半边：亮面 -->
	<path d="M12 2.2l6 5.2-2.1 12.4H12z" fill="#6fcef2" />
	<!-- 左半边：暗面 -->
	<path d="M12 2.2L6 7.4l2.1 12.4H12z" fill="#2b8cc0" />
	<!-- 腰线 -->
	<path d="M6 7.4h12" stroke="#123f5c" stroke-width="1.1" opacity=".85" />
	<!-- 棱 -->
	<path d="M10.5 7.4l-1.7 12.4M13.5 7.4l1.7 12.4" stroke="#123f5c" stroke-width=".9" opacity=".55" />
	<!-- 一点高光 -->
	<path d="M9.4 4.6l1.5 1.3-1.1 2-1.3-1.6z" fill="#e8f8ff" opacity=".85" />
</svg>
