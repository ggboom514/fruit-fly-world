<!--
	「石化」→ 摩艾石像。

	⚠ 第一版画砸了：上下等宽的圆角矩形 + 眉骨 + 两个眼窝方块的组合，
	   在 26px 下读出来是**一台双门冰箱**。错在三处，都改了：

	   ① **轮廓必须上窄下宽**。摩艾的头是锥形的（头顶窄、下颌宽），
	      等宽就是家电。现在顶上 4.8 宽、腰上 11.2 宽。
	   ② **嘴不能省**。抿成一条线的嘴是摩艾第二认得出来的特征，
	      少了它整张脸就只剩「一条横杠 + 一个鼻子」。
	   ③ 眼窝要**紧贴眉骨下缘、而且要小** —— 摩艾的眼睛整个埋在眉骨的
	      阴影里，几乎看不见。画成两个大方块就变成玻璃窗了。

	⚠ 眉骨横贯整张脸，而且**比它那一行的石头亮一档不止**：
	   这块阴影是整张脸的骨架，和石头同色的话整张脸就糊成一坨。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 头：上窄下宽 -->
	<path d="M9.6 2.4h4.8c1.2 0 2 .8 2.2 2.4l1 7.4c.3 2-.2 4.2-1.4 6.2H7.8c-1.2-2-1.7-4.2-1.4-6.2l1-7.4c.2-1.6 1-2.4 2.2-2.4z"
		fill="#8f959b" stroke="#43484e" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 右半边压暗一档，给一点体积 -->
	<path d="M12 2.9h2.4c1.2 0 2 .8 2.2 2.4l1 7.4c.3 2-.2 4.2-1.4 6.2H12z"
		fill="#787e85" opacity=".75" />
	<!-- 眉骨：横贯整张脸，压得很低 -->
	<path d="M7.2 7.2h9.6v1.9H7.2z" fill="#545a60" />
	<!-- 眼窝：紧贴眉骨下缘，小 -->
	<path d="M7.7 9.1h2.6v1.7H7.7zM13.7 9.1h2.6v1.7h-2.6z" fill="#5d6369" />
	<!-- 鼻：又长又直，往下变宽 -->
	<path d="M11.1 9h1.8l1.1 6.4h-4z" fill="#787e85" />
	<!-- 嘴：抿成一条线 -->
	<path d="M9.9 16.1h4.2v1.1H9.9z" fill="#5d6369" />
	<!-- 底座 -->
	<path d="M5.6 18h12.8v3.4H5.6z" fill="#868c92" stroke="#43484e" stroke-width="1.2" stroke-linejoin="round" />
</svg>
