<!--
	「疯狂」→ 菜刀。

	⚠ 刀**横着放**，不是斜的：26px 下的斜线会被抗锯齿糊成一团灰，
	   横平竖直的轮廓才立得住。刀身在左、柄在右 —— 那个方向读起来
	   像「举着刀」，反过来的话像「刀插在地上」。

	⚠ 刀背单独一条深色：整块钢色是平的，加这一条才有「这是一把刀」
	   而不是「一块灰板」。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 柄 -->
	<path d="M15.2 10.4h4.6a1.7 1.7 0 0 1 0 3.4h-4.6z"
		fill="#8a5a2b" stroke="#40260e" stroke-width="1.2" stroke-linejoin="round" />
	<!-- 刀身 -->
	<path d="M3.2 9.2h12v6.8H4.8A1.6 1.6 0 0 1 3.2 14.4z"
		fill="#d5dae2" stroke="#454c55" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 刀背 -->
	<path d="M3.2 9.2h12v1.5h-12z" fill="#a5adba" />
	<!-- 刃口 -->
	<path d="M3.2 15.1h12v.9h-12z" fill="#ffffff" opacity=".9" />
</svg>
