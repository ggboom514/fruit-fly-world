<!--
	「封禁」→ 一把金锤砸在一条横杠上。

	⚠ 锤子是**横着放的**，不是竖着的。竖锤在这个尺寸下和「石化的摩艾」
	   撞脸（都是一根竖杆 + 顶上一坨），26px 下根本分不出谁是谁。
	   横过来之后轮廓是「左边一个方头、右边一根细柄」，
	   和另外六个图标的剪影都不一样。

	⚠ 锤头必须是**方**的，不能是圆的：圆头配横柄读出来是「棒棒糖」。
	   方 + 厚 + 一条高光线，才是锤子。

	⚠ 那条横杠（被砸中的东西）是刻意的：单独一把锤子只说明「有把锤子」，
	   砸在一条杠上才说明「这一下打上去了」—— 而且横杠正好补上了
	   左下角那块空，不然整个图形重心全在右上。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- 锤头：方、厚，靠左 -->
	<path d="M3.2 7.6h8.4c.7 0 1.2.5 1.2 1.2v4c0 .7-.5 1.2-1.2 1.2H3.2c-.7 0-1.2-.5-1.2-1.2v-4c0-.7.5-1.2 1.2-1.2z"
		fill="#e8b84b" stroke="#8a5f10" stroke-width="1.3" stroke-linejoin="round" />
	<!-- 锤头下沿压暗一档，给体积 -->
	<path d="M2 10.9h11.8v1.9c0 .7-.5 1.2-1.2 1.2H3.2c-.7 0-1.2-.5-1.2-1.2z" fill="#c1912c" />
	<!-- 锤面上那一道高光：金的，和「点石成金」的闪光同一族颜色 -->
	<path d="M3.4 8.5h3.1v1.1H3.4z" fill="#fff0bb" />

	<!-- 锤柄：细、往右伸 -->
	<path d="M12.8 9.7h5.6c.6 0 1 .4 1 1v2c0 .6-.4 1-1 1h-5.6z"
		fill="#a9761a" stroke="#8a5f10" stroke-width="1.2" stroke-linejoin="round" />
	<!-- 柄端配重 -->
	<path d="M18.4 8.6h2.4c.7 0 1.2.5 1.2 1.2v2.9c0 .7-.5 1.2-1.2 1.2h-2.4z"
		fill="#e8b84b" stroke="#8a5f10" stroke-width="1.3" stroke-linejoin="round" />

	<!-- 被砸的那条横杠 -->
	<path d="M3.6 17.6h16.8v2.6H3.6z" fill="#6b6257" stroke="#3d372f" stroke-width="1.2" stroke-linejoin="round" />
	<!-- 砸中的裂口 -->
	<path d="M9.8 17.6l1.6 2.6h1.9l-1.6-2.6z" fill="#9a8f7e" />
</svg>
